{% extends 'base.html' %}
{% block body %}
<div class="card narrow">
<h1>{{ 'První spuštění – vytvořte administrátora' if mode == 'setup' else 'Přihlášení' }}</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if mode == 'setup' %}<label>Jméno<input name="name" required></label>{% endif %}
<label>E-mail<input name="email" type="email" required autofocus></label>
<label>Heslo{% if mode == 'setup' %} (min. 8 znaků){% endif %}<input name="password" type="password" required minlength="{{ 8 if mode == 'setup' else 1 }}"></label>
<button class="btn">{{ 'Vytvořit' if mode == 'setup' else 'Přihlásit' }}</button>
</form></div>
{% endblock %}
