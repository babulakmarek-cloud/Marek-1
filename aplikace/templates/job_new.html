{% extends 'base.html' %}
{% block body %}
<h1>Nová zakázka</h1>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Zákazník<select name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}" {{ 'selected' if sel|string==c.id|string }}>{{ c.name }} ({{ c.country }})</option>{% endfor %}</select></label>
<label>Název<input name="name" required></label>
<label>Adresa stavby<input name="site_address"></label>
<div class="grid2"><label>Měna<select name="currency"><option>CZK</option><option>EUR</option></select></label>
<label>Rozpočet<input name="budget" inputmode="decimal"></label></div>
<div class="grid2"><label>Zahájení<input type="date" name="start_date" value="{{ today }}"></label><label>Plánované dokončení<input type="date" name="end_plan"></label></div>
<button class="btn">Vytvořit</button></form>
{% if not customers %}<p class="flash">Nejdřív přidejte zákazníka.</p>{% endif %}
{% endblock %}
