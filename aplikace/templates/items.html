{% extends 'base.html' %}
{% block body %}
<h1>Ceník a materiál</h1>
<div class="card scroll"><table><tr><th>Název</th><th>Jedn.</th><th>Nákup Kč</th><th>Nákup €</th><th>Prodej Kč</th><th>Prodej €</th><th></th></tr>
{% for i in rows %}<tr><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ i.id }}">
<td><input name="name" value="{{ i.name }}"></td><td><input name="unit" value="{{ i.unit }}" size="4"></td>
<td><input name="buy_czk" value="{{ i.buy_czk|num }}" size="7"></td><td><input name="buy_eur" value="{{ i.buy_eur|num }}" size="7"></td>
<td><input name="sell_czk" value="{{ i.sell_czk|num }}" size="7"></td><td><input name="sell_eur" value="{{ i.sell_eur|num }}" size="7"></td>
<td><button class="btn alt">Uložit</button> <button class="link" name="act" value="del" onclick="return confirm('Smazat?')">×</button></td></form></tr>{% endfor %}
<tr><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><td><input name="name" placeholder="Nová položka" required></td><td><input name="unit" value="ks" size="4"></td>
<td><input name="buy_czk" size="7"></td><td><input name="buy_eur" size="7"></td><td><input name="sell_czk" size="7"></td><td><input name="sell_eur" size="7"></td><td><button class="btn">Přidat</button></td></form></tr></table></div>
{% endblock %}
