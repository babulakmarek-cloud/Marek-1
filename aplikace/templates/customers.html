{% extends 'base.html' %}
{% block body %}
<div class="row"><h1>Zákazníci</h1><a class="btn" href="{{ url_for('customer', cid='new') }}">+ Nový</a></div>
<div class="card"><table>
{% for c in rows %}<tr><td><a href="{{ url_for('customer', cid=c.id) }}">{{ c.name }}</a></td><td>{{ c.country }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td></tr>
{% else %}<tr><td class="muted">Žádní zákazníci.</td></tr>{% endfor %}
</table></div>
{% endblock %}
