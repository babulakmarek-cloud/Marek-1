{% extends 'base.html' %}
{% block body %}
<h1>Uživatelé</h1>
<div class="card"><table>{% for u in rows %}<tr><td>{{ u.name }}<br><small class="muted">{{ u.email }}</small></td><td>{{ 'Admin' if u.role=='admin' else 'Montér' }}</td><td>{{ 'aktivní' if u.active else 'zablokován' }}</td>
<td><form method="post" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ u.id }}"><button class="link" name="act" value="toggle">{{ 'zablokovat' if u.active else 'povolit' }}</button></form>
<form method="post" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ u.id }}"><input type="hidden" name="act" value="pw"><input type="password" name="password" placeholder="nové heslo" minlength="8" size="10"><button class="link">změnit heslo</button></form></td></tr>{% endfor %}</table></div>
<h2>Přidat uživatele</h2>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="act" value="add">
<div class="grid2"><label>Jméno<input name="name" required></label><label>E-mail<input name="email" type="email" required></label></div>
<div class="grid2"><label>Heslo (min. 8 znaků)<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option value="worker">Montér (deník, fotky, materiál, pokrok)</option><option value="admin">Admin (vše včetně cen a faktur)</option></select></label></div>
<button class="btn">Přidat</button></form>
{% endblock %}
