{% extends 'base.html' %}
{% block body %}
<p><a href="{{ url_for('gallery', jid=j.id) }}">← Fotky</a></p>
<h1>Popisky fotek · {{ j.name }}</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
{% for p in photos %}<div class="card"><input type="hidden" name="pid" value="{{ p.id }}">
<div class="cap"><a href="{{ url_for('upload', fn=p.filename) }}" target="_blank"><img src="{{ url_for('upload', fn=p.filename) }}" loading="lazy" alt=""></a>
<div><label>Popis<textarea name="caption_{{ p.id }}" rows="3">{{ p.caption }}</textarea></label>
<div class="grid2"><label>Místo<input name="area_{{ p.id }}" value="{{ p.area }}"></label>
<label>Fáze<select name="phase_{{ p.id }}">{% for k,v in PHASES.items() %}<option value="{{ k }}" {{ 'selected' if k==p.phase }}>{{ v }}</option>{% endfor %}</select></label></div></div></div></div>
{% else %}<p class="muted">Žádné fotky.</p>{% endfor %}
<button class="btn" style="position:sticky;bottom:10px">Uložit všechny popisky</button></form>
{% endblock %}
